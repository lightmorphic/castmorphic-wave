name: Deploy website

# Rebuilds the GitHub Pages copy of the website whenever the site
# changes on main. The Pages variant is generated by
# scripts/build-pages.js and served from the gh-pages branch.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-pages.js'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Pages variant
        run: node scripts/build-pages.js /tmp/pages-build

      - name: Push it to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/pages-build
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy website"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
