name: Deploy website

# Publishes the site/ folder to GitHub Pages (via the gh-pages branch)
# whenever it changes on main.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # "Page last updated" means the site, so it comes from the last commit
      # that touched site/, not from the deploy clock or the changelog.
      - name: Stamp the last-updated date from the changelog
        run: |
          DATE=$(git log -1 --format=%cs -- site/)
          DISPLAY=$(date -u -d "$DATE" '+%-d %B %Y')
          sed -i -E "s|<time datetime=\"[0-9-]+\">[^<]*</time>|<time datetime=\"$DATE\">$DISPLAY</time>|" site/*.html
          sed -i -E "s|(\"dateModified\": \")[0-9-]+|\1$DATE|g" site/index.html
          sed -i -E "s|(<lastmod>)[0-9-]+|\1$DATE|g" site/sitemap.xml
          echo "stamped $DATE"

      - name: Push the site to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy website"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
